name: Fantasy Saudi Pro League Fetch

on:
  schedule:
    - cron: '7 1 * * *'   # Primary fetch at 1am UTC
    - cron: '7 2 * * *'   # Retry if 1am blocked by live/unprocessed data
    - cron: '7 3 * * *'   # Final retry if 2am still blocked
    - cron: '7 9,12,15,18,21 * * *'   # Daytime closure checks (write nothing unless a fetch happens)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no files written)'
        required: false
        default: false
        type: boolean
      force:
        description: 'Force full fetch'
        required: false
        default: false
        type: boolean
      date:
        description: 'Override target date YYYY-MM-DD (default: yesterday UTC)'
        required: false
        type: string

# Never let two runs overlap: GitHub can start a nightly slot hours late, so it
# could otherwise run alongside a daytime closure check and race it to push.
# Later runs queue behind the one in progress instead.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: write   # Required to commit and push fetched data

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Check out the branch tip at run time rather than the commit that
          # queued the run, so a queued run sees the manifest pushed just before it.
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Determine current season
        id: season
        env:
          EVENT_NAME: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
        run: |
          # Derived from the league API itself (first event's deadline_time),
          # NOT the calendar. The old game keeps serving last season's data
          # until the new game launches, so a calendar rule mislabels the
          # finished season during that window.
          #
          # If the API is unreachable (5xx, between-games maintenance) on the
          # 1am or 2am slot, defer to the next scheduled retry instead of
          # failing — a transient outage that clears by 3am should not raise
          # an alert. The 3am slot and manual runs still fail on an
          # unreachable API so a real outage is seen once a day.
          set +e
          SEASON=$(python3 scripts/current_season.py)
          STATUS=$?
          set -e
          if [ "$STATUS" -ne 0 ] || ! [[ "$SEASON" =~ ^20[0-9]{2}$ ]]; then
            if [ "$EVENT_NAME" == "schedule" ] && [[ "$CRON" != *" 3 * * *" ]]; then
              echo "League API unavailable (exit $STATUS) — deferring to the next scheduled retry"
              echo "League API unavailable at this slot — deferred to the next scheduled retry" >> "$GITHUB_STEP_SUMMARY"
              echo "skip=true" >> $GITHUB_OUTPUT
              exit 0
            fi
            echo "FATAL: could not derive season from the league API (exit $STATUS, output '$SEASON')"
            exit 1
          fi
          echo "Season: $SEASON"
          echo "season=$SEASON" >> $GITHUB_OUTPUT

      # ── Build fetch arguments ────────────────────────────────

      - name: Build fetch arguments
        id: fetch_args
        if: steps.season.outputs.skip != 'true'
        env:
          EVENT_NAME: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
        run: |
          ARGS="--season ${{ steps.season.outputs.season }} --output data/${{ steps.season.outputs.season }}"

          # The 1-3am slots are the daily runs and always refresh bootstrap and
          # fixtures. Any other schedule is a daytime closure check: it writes
          # (and so commits) only when a player fetch actually happens.
          if [ "$EVENT_NAME" == "schedule" ]; then
            case "$CRON" in
              *" 1 * * *"|*" 2 * * *"|*" 3 * * *") ;;
              *) ARGS="$ARGS --no-idle-writes" ;;
            esac
          fi

          if [ "${{ github.event.inputs.dry_run }}" == "true" ]; then
            ARGS="$ARGS --dry-run"
          fi

          if [ "${{ github.event.inputs.force }}" == "true" ]; then
            ARGS="$ARGS --force"
          fi

          if [ -n "${{ github.event.inputs.date }}" ]; then
            ARGS="$ARGS --date ${{ github.event.inputs.date }}"
          fi

          echo "args=$ARGS" >> $GITHUB_OUTPUT
          echo "Fetch args: $ARGS"

      # ── Run fetch ────────────────────────────────────────────

      - name: Run fetch
        id: fetch
        if: steps.season.outputs.skip != 'true'
        run: python3 scripts/fetch.py ${{ steps.fetch_args.outputs.args }}

      # ── Generate CSVs and latest/ (only when players were fetched) ──

      - name: Generate CSVs
        if: |
          steps.season.outputs.skip != 'true' &&
          github.event.inputs.dry_run != 'true' &&
          steps.fetch.outputs.fetch_type != 'none' &&
          steps.fetch.outputs.fetch_type != 'waiting' &&
          steps.fetch.outputs.fetch_type != 'blocked'
        run: |
          python3 scripts/generate_csv.py \
            --season ${{ steps.season.outputs.season }}

      - name: Generate latest/
        if: |
          steps.season.outputs.skip != 'true' &&
          github.event.inputs.dry_run != 'true' &&
          steps.fetch.outputs.fetch_type != 'none' &&
          steps.fetch.outputs.fetch_type != 'waiting' &&
          steps.fetch.outputs.fetch_type != 'blocked'
        run: |
          python3 scripts/generate_latest.py \
            --season ${{ steps.season.outputs.season }}

      # ── Commit and push ──────────────────────────────────────

      - name: Commit and push
        if: steps.season.outputs.skip != 'true' && github.event.inputs.dry_run != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ latest/
          git diff --cached --quiet && echo "Nothing to commit" || \
            git commit -m "spl data: ${{ steps.fetch.outputs.gw_label }}${{ steps.fetch.outputs.fetch_type }} $(date -u +%Y-%m-%d)"
          git push

      # ── Optional heartbeat ───────────────────────────────────
      # Set a repo secret named HEARTBEAT_PING_URL to enable; skipped otherwise.

      - name: Heartbeat ping
        if: success() && steps.season.outputs.skip != 'true'
        env:
          PING_URL: ${{ secrets.HEARTBEAT_PING_URL }}
        run: |
          if [ -n "$PING_URL" ]; then
            curl -fsS --retry 3 "$PING_URL"
          else
            echo "No HEARTBEAT_PING_URL secret configured — skipping"
          fi
