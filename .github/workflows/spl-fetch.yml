name: Fantasy Saudi Pro League Fetch

# Runs are started by the ism-fantasy-scheduler Cloudflare Worker through
# workflow_dispatch with a `slot` input. There is deliberately no `schedule`
# trigger: GitHub's cron queue was starting runs hours late.
on:
  workflow_dispatch:
    inputs:
      slot:
        description: 'Scheduler slot (manual = run now like nightly, fail if the API is down)'
        required: false
        default: manual
        type: choice
        options:
          - manual
          - nightly
          - retry
          - final
          - daytime
      dry_run:
        description: 'Dry run (no files written)'
        required: false
        default: false
        type: boolean
      force:
        description: 'Force full fetch'
        required: false
        default: false
        type: boolean
      date:
        description: 'Override target date YYYY-MM-DD (default: yesterday UTC)'
        required: false
        type: string

# Never let two runs overlap: GitHub can start a nightly slot hours late, so it
# could otherwise run alongside a daytime closure check and race it to push.
# Later runs queue behind the one in progress instead.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: write   # Required to commit and push fetched data

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Check out the branch tip at run time rather than the commit that
          # queued the run, so a queued run sees the manifest pushed just before it.
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Resolve slot
        id: slot
        env:
          INPUT_SLOT: ${{ github.event.inputs.slot }}
        run: |
          # Which slot is this run? The ism-fantasy-scheduler Worker passes it
          # as the `slot` input. A run started by hand without a slot is `manual`.
          #   nightly — daily run: refresh bootstrap/fixtures, fetch yesterday's results
          #   retry   — repeat nightly only if it fetched nothing; write nothing when idle
          #   final   — last retry; the only slot that fails on an unreachable API
          #   daytime — gameweek-closure check; write nothing when idle
          #   manual  — like nightly, but fails on an unreachable API
          SLOT="$INPUT_SLOT"
          case "$SLOT" in
            "") SLOT=manual ;;
            manual|nightly|retry|final|daytime) ;;
            *) echo "FATAL: unknown slot '$SLOT'"; exit 1 ;;
          esac
          echo "Slot: $SLOT"
          echo "slot=$SLOT" >> $GITHUB_OUTPUT

      - name: Determine current season
        id: season
        env:
          SLOT: ${{ steps.slot.outputs.slot }}
        run: |
          # Derived from the league API itself (first event's deadline_time),
          # NOT the calendar. The old game keeps serving last season's data
          # until the new game launches, so a calendar rule mislabels the
          # finished season during that window.
          #
          # If the API is unreachable (5xx, between-games maintenance) on the
          # nightly, retry or daytime slot, defer to the next slot instead of
          # failing — a transient outage should not raise an alert. The final
          # slot and manual runs still fail on an unreachable API, so a real
          # outage is seen once a day.
          set +e
          SEASON=$(python3 scripts/current_season.py)
          STATUS=$?
          set -e
          if [ "$STATUS" -ne 0 ] || ! [[ "$SEASON" =~ ^20[0-9]{2}$ ]]; then
            case "$SLOT" in
              nightly|retry|daytime)
                echo "League API unavailable (exit $STATUS) — deferring to the next slot"
                echo "League API unavailable at the $SLOT slot — deferred to the next slot" >> "$GITHUB_STEP_SUMMARY"
                echo "skip=true" >> $GITHUB_OUTPUT
                exit 0 ;;
            esac
            echo "FATAL: could not derive season from the league API (exit $STATUS, output '$SEASON')"
            exit 1
          fi
          echo "Season: $SEASON"
          echo "season=$SEASON" >> $GITHUB_OUTPUT

      # ── Build fetch arguments ────────────────────────────────

      - name: Build fetch arguments
        id: fetch_args
        if: steps.season.outputs.skip != 'true'
        env:
          SLOT: ${{ steps.slot.outputs.slot }}
          SEASON: ${{ steps.season.outputs.season }}
          # Inputs arrive through the environment, never spliced into the
          # script: a workflow_dispatch input is text from whoever started the
          # run, and this job can push to the repo.
          INPUT_DRY_RUN: ${{ github.event.inputs.dry_run }}
          INPUT_FORCE: ${{ github.event.inputs.force }}
          INPUT_DATE: ${{ github.event.inputs.date }}
        run: |
          ARGS="--season $SEASON --output data/$SEASON"

          # Only the nightly and manual slots refresh bootstrap and fixtures on
          # an idle day. Retries and daytime closure checks write — and so
          # commit — only when a player fetch actually happens.
          case "$SLOT" in
            retry|final|daytime) ARGS="$ARGS --no-idle-writes" ;;
          esac

          if [ "$INPUT_DRY_RUN" == "true" ]; then
            ARGS="$ARGS --dry-run"
          fi

          if [ "$INPUT_FORCE" == "true" ]; then
            ARGS="$ARGS --force"
          fi

          if [ -n "$INPUT_DATE" ]; then
            if ! [[ "$INPUT_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
              echo "FATAL: date must be YYYY-MM-DD, got '$INPUT_DATE'"
              exit 1
            fi
            ARGS="$ARGS --date $INPUT_DATE"
          fi

          echo "args=$ARGS" >> $GITHUB_OUTPUT
          echo "Fetch args: $ARGS"

      # ── Run fetch ────────────────────────────────────────────

      - name: Run fetch
        id: fetch
        if: steps.season.outputs.skip != 'true'
        env:
          ARGS: ${{ steps.fetch_args.outputs.args }}
        run: python3 scripts/fetch.py $ARGS

      # ── Generate CSVs and latest/ (only when players were fetched) ──
      # These steps and the commit also run when the fetch step failed part-way
      # (a player still missing after its retry): the players that did arrive
      # and the manifest listing the failed IDs are committed, and the run
      # still fails so the failure is seen. An empty fetch_type means the
      # script stopped before reporting anything (season guard, API down), so
      # there is nothing to generate or commit.

      - name: Generate CSVs
        if: |
          steps.season.outputs.skip != 'true' &&
          github.event.inputs.dry_run != 'true' &&
          steps.fetch.outputs.fetch_type != '' &&
          steps.fetch.outputs.fetch_type != 'none' &&
          steps.fetch.outputs.fetch_type != 'waiting' &&
          steps.fetch.outputs.fetch_type != 'blocked' &&
          !cancelled()
        run: |
          python3 scripts/generate_csv.py \
            --season ${{ steps.season.outputs.season }}

      - name: Generate latest/
        if: |
          steps.season.outputs.skip != 'true' &&
          github.event.inputs.dry_run != 'true' &&
          steps.fetch.outputs.fetch_type != '' &&
          steps.fetch.outputs.fetch_type != 'none' &&
          steps.fetch.outputs.fetch_type != 'waiting' &&
          steps.fetch.outputs.fetch_type != 'blocked' &&
          !cancelled()
        run: |
          python3 scripts/generate_latest.py \
            --season ${{ steps.season.outputs.season }}

      # ── Commit and push ──────────────────────────────────────

      - name: Commit and push
        if: |
          steps.season.outputs.skip != 'true' &&
          github.event.inputs.dry_run != 'true' &&
          steps.fetch.outputs.fetch_type != '' &&
          !cancelled()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ latest/
          git diff --cached --quiet && echo "Nothing to commit" || \
            git commit -m "spl data: ${{ steps.fetch.outputs.gw_label }}${{ steps.fetch.outputs.fetch_type }} $(date -u +%Y-%m-%d)"
          git push

      # ── Optional heartbeat ───────────────────────────────────
      # Set a repo secret named HEARTBEAT_PING_URL to enable; skipped otherwise.
      # Not sent for dry runs: a dry run must not stand in for a real one.

      - name: Heartbeat ping
        if: success() && steps.season.outputs.skip != 'true' && github.event.inputs.dry_run != 'true'
        env:
          PING_URL: ${{ secrets.HEARTBEAT_PING_URL }}
        run: |
          if [ -n "$PING_URL" ]; then
            curl -fsS --retry 3 "$PING_URL"
          else
            echo "No HEARTBEAT_PING_URL secret configured — skipping"
          fi
